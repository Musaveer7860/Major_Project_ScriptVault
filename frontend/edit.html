<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Snippet - ScriptVault</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=4">
    
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/editor/editor.main.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="/dashboard" class="sidebar-logo">
                    <i class="fa-solid fa-vault"></i> SCRIPTVAULT
                </a>
            </div>
            
            <div class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-info">
                        <div class="user-name" id="user-name">Username</div>
                        <div class="user-email" id="user-email">user@domain.com</div>
                    </div>
                </div>
            </div>
        </aside>
 
        <main class="app-main">
            <div class="app-content">
                <div class="page-container">
                    <div class="page-header">
                        <a href="/dashboard" class="btn-icon">
                            <i class="fa-solid fa-arrow-left"></i>
                        </a>
                        <h2 class="content-title">Edit Snippet</h2>
                    </div>
 
                    <div class="page-card">
                        <form id="edit-snippet-form">
                            <div class="form-group">
                                <label for="title">Snippet Title</label>
                                <input type="text" id="title" class="form-control" required placeholder="e.g. Binary Search Implementation">
                            </div>
 
                            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div>
                                    <label for="language">Programming Language</label>
                                    <select id="language" class="form-control" required>
                                        <option value="" selected>Auto-Detect Language</option>
                                        <option value="Python">Python</option>
                                        <option value="JavaScript">JavaScript</option>
                                        <option value="Java">Java</option>
                                        <option value="C">C</option>
                                        <option value="C++">C++</option>
                                        <option value="HTML">HTML</option>
                                        <option value="CSS">CSS</option>
                                        <option value="SQL">SQL</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="tags">Tags (comma separated)</label>
                                    <input type="text" id="tags" class="form-control" placeholder="e.g. algorithm, search, binary">
                                </div>
                            </div>

                            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div>
                                    <label for="workspace-select">Target Workspace</label>
                                    <select id="workspace-select" class="form-control" required>
                                        
                                    </select>
                                </div>
                                <div>
                                    <label for="collection-select">Target Folder / Collection</label>
                                    <select id="collection-select" class="form-control">
                                        <option value="">None (Root)</option>
                                        
                                    </select>
                                </div>
                            </div>
 
                            <div class="form-group">
                                <label for="code">Source Code</label>
                                <div id="monaco-editor-container" style="height: 400px; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 0.5rem;"></div>
                                <textarea id="code" style="display: none;"></textarea>
                            </div>

                            <div class="form-actions">
                                <a href="/dashboard" class="btn btn-secondary">
                                    <i class="fa-solid fa-xmark"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <footer class="app-footer" style="text-align: center; padding: 2rem 0 1rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 3rem;">
                        ScriptVault Copy Rights Reserved 2026
                    </footer>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/edit.js"></script>
</body>
</html>
